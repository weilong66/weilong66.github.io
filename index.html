<script type="text/javascript">
    const particlesDisplay = window.localStorage.getItem("particlesDisplay") || 'block'; //从浏览器储存中获取动画显示状态值，如果没有默认为block
    const particlesElement = document.getElementById('particles-js');
    if (particlesElement) {
        particlesElement.style.display = particlesDisplay;
        if (particlesDisplay !== 'none') {
            newParticlesJS();
        }
    }
