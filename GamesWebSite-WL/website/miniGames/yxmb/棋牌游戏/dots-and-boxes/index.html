<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="utf-8">
	<meta http-equiv="X-UA-Compatible" content="IE=edge">
	<meta name="description" content="A front-end template that helps you build fast, modern mobile web apps.">
	<meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">

	<title>点格棋 | Dots and Boxes Game</title>

	<!-- Add to homescreen for Chrome on Android -->
	<meta name="mobile-web-app-capable" content="yes">
	<link rel="icon" sizes="192x192" href="images/android-desktop.png">

	<!-- Add to homescreen for Safari on iOS -->
	<meta name="apple-mobile-web-app-capable" content="yes">
	<meta name="apple-mobile-web-app-status-bar-style" content="black">
	<meta name="apple-mobile-web-app-title" content="Material Design Lite">
	<link rel="apple-touch-icon-precomposed" href="images/ios-desktop.png">

	<!-- Tile icon for Win8 (144x144 + tile color) -->
	<meta name="msapplication-TileImage" content="images/touch/ms-touch-icon-144x144-precomposed.png">
	<meta name="msapplication-TileColor" content="#3372DF">

	<link rel="shortcut icon" href="images/favicon.png">

	<!-- <link rel="stylesheet"
		href="https://fonts.googleapis.com/css?family=Roboto:regular,bold,italic,thin,light,bolditalic,black,medium&amp;lang=en">
	<link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons" /> -->
	<link rel="stylesheet" href="./css/material.light_blue-amber.min.css" />
	<script defer src="./lib/material.min.js"></script>

	<script src="./lib/jquery.min-3.2.1.js"></script>

	<link rel="stylesheet" type="text/css" href="./style.css" />
	<script type="text/javascript" src="./main.js"></script>
</head>

<body>
	<div class="demo-layout mdl-layout mdl-layout--fixed-header mdl-js-layout mdl-color--grey-100">
		<div class="demo-ribbon"></div>
		<main class="demo-main mdl-layout__content">
			<div class="demo-container mdl-grid">
				<div class="mdl-cell mdl-cell--2-col mdl-cell--hide-tablet mdl-cell--hide-phone"></div>
				<div
					class="demo-content mdl-color--white mdl-shadow--4dp content mdl-color-text--grey-800 mdl-cell mdl-cell--8-col">

					<div class="section" id='gamesec'>
						<h3>Game</h3>
						<p align="center" id='turn-signal' style="font-weight: bold;">游戏未开始</p>
						<div id="game"></div>
						<p style="float: left;color: #FF0000;" id='player1-score'>玩家 A 得分: 0</p>
						<p style="float: right;color: #0000ff;" id='player2-score'>玩家 B 得分: 0</p>
						<br>
						<div id="game-controls">
							<form action="javascript:savestate()">
								<!-- Accent-colored raised button with ripple -->
								<button
									class="mdl-button mdl-js-button mdl-button--raised mdl-js-ripple-effect mdl-button--accent">
									保存
								</button>
							</form>
							<form action="javascript:setWHVals()">
								<!-- Accent-colored raised button with ripple -->
								<button
									class="mdl-button mdl-js-button mdl-button--raised mdl-js-ripple-effect mdl-button--accent">
									重置
								</button>
							</form>
							<span id="game-status-message" style="display: none;"></span>
						</div>
					</div>
					<div class="section">
						<h3>Options</h3>

						<form action="javascript:setWHVals()">
							<div class="mdl-textfield mdl-js-textfield mdl-textfield--floating-label">
								<input class="mdl-textfield__input" type="text" pattern="-?[0-9]*(\.[0-9]+)?" value="5"
									id="width" name="width">
								<label class="mdl-textfield__label" for="width">宽度</label>
								<span class="mdl-textfield__error">必须输入数字!</span>
							</div>
							<div class="mdl-textfield mdl-js-textfield mdl-textfield--floating-label">
								<input class="mdl-textfield__input" type="text" pattern="-?[0-9]*(\.[0-9]+)?" value="5"
									id="height" name="height">
								<label class="mdl-textfield__label" for="height">高度</label>
								<span class="mdl-textfield__error">必须输入数字!</span>
							</div>
							<button
								class="mdl-button mdl-js-button mdl-button--raised mdl-js-ripple-effect mdl-button--accent">
								开始
							</button>
						</form>
						<p>玩法说明：每个玩家轮流以纵或横方向选择一条空白线段。如果选择线段后使得一个区域封闭，选择该线段的玩家占领该区域，得分加 1。
							当没有可选线段时，游戏结束。最后得分最高的玩家获得胜利。
						</p>
					</div>


				</div>
			</div>
		</main>
	</div>
</body>
</html>
