<script>
	document.addEventListener('DOMContentLoaded', function () {
		//遍历JSON文件数据
		fetch('data/websitePath.json')
			.then(response => response.json())
			.then(data => {
				const navList = document.querySelector('.nav');
				//遍历json数据，创建导航项
				data.forEach((item, index) => {
					if (item.type === 'folder') {
						let li = document.createElement('li');
						if (index === 0) {
							li.className = 'active';
						}


						const a = document.createElement('a');
						a.href = `link/${item.name}`;
						a.target = 'right';

						const i = document.createElement('i');
						if (item.icon) {
							i.className = item.icon;
						} else {
							i.className = 'fa fa-gamepad';
						}

						const p = document.createElement('p');
						p.textContent = item.name.replace('.html', ''); //将分类名称设置给P元素
						li.setAttribute('data-value', p.textContent); //同样也设置给li标签的data-value属性

						a.appendChild(i);
						a.appendChild(p);
						li.appendChild(a);
						navList.appendChild(li);
					}
				});
				//导航项创建完成后为每个导航项绑定点击事件
				navBindingClick();
				//根据URL哈希值选中并点击对应导航项。
				highlightCurrentLi();
			})
			.catch(error => console.error('Error loading JSON:', error));
	});
</script>

<script type="text/javascript">
	// 定义一个函数，用于绑定导航栏的点击事件
	function navBindingClick() {
		// 给导航栏的每个li元素绑定点击事件
		$(".nav li").click(function () {

			// 移除所有li元素的active类
			$(".nav li").removeClass("active");
			// 给当前点击的li元素添加active类
			$(this).addClass("active");

			// 使用 data 属性来存储和获取值，因为 value 主要用于表单元素
			var dataValue = this.getAttribute('data-value');
			if (dataValue) {
				// 构建新的哈希值
				var newHash = '#' + encodeURIComponent(dataValue);
				// 如果新旧哈希不同，则更新 URL 并阻止默认行为（如果有的话）
				if (window.location.hash !== newHash) {
					window.location.hash = newHash;
				}
			}
		})

		// 获取当前页面的基础URL
		const baseURL = getBaseURL();
		// 如果基础URL存在
		if (baseURL) {
			// 将返回首页的链接的href属性设置为基础URL
			document.getElementById('back-home-link').href = baseURL;
		}

		// Javascript method's body can be found in assets/js/demos.js
	}

	//获取基础URL（获取的是index.html的前缀）
	function getBaseURL() {
		// 获取完整的URL
		const fullUrl = window.location.href;
		const regex = /^(https?\:\/\/.*\/)games\/?/;
		const matches = fullUrl.match(regex);
		if (matches) {
			return matches[0];
		}
		return "";

	}

	/**
	 * 页面加载时自动选中点击对应的 li
	 */
	function highlightCurrentLi() {
		const currentHash = window.location.hash;

		// 仅在当前 URL 的 hash 非空时执行
		if (currentHash) {
			const decodedHash = decodeURIComponent(currentHash.substring(1)); // 去掉 # 并解码
			document.querySelectorAll('ul.nav li').forEach(li => {
				const dataValue = li.getAttribute('data-value');
				if (dataValue === decodedHash) {
					li.classList.add('active'); // 添加高亮样式
					// 获取当前元素中的a标签，如果存在则触发其点击事件
					const aTag = li.querySelector('a');
					if (aTag) {
						aTag.click(); // 触发 a 标签的 click 事件
					}
				} else {
					li.classList.remove('active');
				}
			});
		}/*  else {
			const aTag = document.querySelector('ul.nav li a');
			if (aTag) {
				aTag.click(); // 触发 a 标签的 click 事件
			}
		} */
	}
</script>
